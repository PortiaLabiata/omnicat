[package]
name = "omnicat"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["rt", "net", "fs", "io-std", "io-util", "rt-multi-thread", "macros"] }
transport = { path = "./transport" }
stdio = { path = "./stdio" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
